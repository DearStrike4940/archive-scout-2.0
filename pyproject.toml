[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-scout"
version = "2.0.0a1"
description = "A cross-platform desktop research tool for indexing, downloading, rescanning, and reviewing public Wayback Machine captures"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Archive Scout contributors"}]
dependencies = ["truststore>=0.10,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Environment :: X11 Applications",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
archive-scout = "archive_scout.cli:main"

[project.gui-scripts]
archive-scout-gui = "archive_scout.app:main"

[tool.setuptools.packages.find]
include = ["archive_scout*"]
