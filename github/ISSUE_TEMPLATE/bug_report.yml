name: Bug report
description: Report a reproducible Archive Scout problem
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options: [Windows x64, Linux x64, macOS Intel, macOS Apple Silicon, Source]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Archive Scout version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Error text or log output
