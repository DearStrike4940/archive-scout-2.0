name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-runtime.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Verify GUI and TLS support
        run: python -c "import tkinter, truststore; print('Windows x64 GUI and trust store ready')"
      - name: Build Windows x64 package
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveScout-Windows-x64
          path: |
            release/ArchiveScout-Windows-x64.zip
            release/ArchiveScout-Windows-x64.zip.sha256
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install system GUI libraries
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Verify GUI and TLS support
        run: python -c "import tkinter, truststore; print('Linux x64 GUI and trust store ready')"
      - name: Build Linux x64 package
        run: ./scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveScout-Linux-x64
          path: |
            release/ArchiveScout-Linux-x64.tar.gz
            release/ArchiveScout-Linux-x64.tar.gz.sha256
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Verify Universal2 Python, GUI, and TLS support
        run: |
          python -c "import tkinter, truststore; print('macOS GUI and trust store ready')"
          lipo -archs "$(python -c 'import sys; print(sys.executable)')"
      - name: Build universal macOS package
        run: ./scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveScout-macOS-Universal
          path: |
            release/ArchiveScout-macOS-Universal.dmg
            release/ArchiveScout-macOS-Universal.dmg.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Archive Scout $TAG" --generate-notes
          fi
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
